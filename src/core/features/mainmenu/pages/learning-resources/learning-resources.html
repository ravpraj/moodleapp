<ion-header>
    <ion-toolbar>
        <ion-title>
            <h1>{{ 'core.mainmenu.learningresources' | translate }}</h1>
        </ion-title>
    </ion-toolbar>
</ion-header>
<ion-content>
    <ion-list>
        <ion-item button [href]="resourcesUrl" [inApp]="true" core-link [detail]="true">

                <p class="item-heading">{{ 'core.mainmenu.openlearningresources' | translate }}</p>
            </ion-label>
        </ion-item>
    </ion-list>
</ion-content>
