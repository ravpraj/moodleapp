name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Moodle App
        run: npm run build:prod

      - name: Add iOS platform
        run: npx cordova platform add ios

      - name: Show iOS project
        run: |
          echo "iOS files:"
          ls -la platforms/ios

          echo "Workspaces:"
          find platforms/ios -name "*.xcworkspace" -print

          echo "Projects:"
          find platforms/ios -name "*.xcodeproj" -print

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace platforms/ios/*.xcworkspace \
            -scheme "moodleappfs" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          APP_PATH=$(find build/derived/Build/Products -name "*.app" -type d | head -1)

          echo "Application found:"
          echo "$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app file was produced"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -r MoodleApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoodleApp-iOS-unsigned
          path: build/MoodleApp.ipa
